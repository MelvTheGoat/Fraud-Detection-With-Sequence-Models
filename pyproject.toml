[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-sequences"
version = "0.1.0"
description = "Sequence models vs gradient boosting for real-time transaction fraud detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "lightgbm>=4.1",
    "torch>=2.1",
    "matplotlib>=3.8",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "onnx>=1.15", "onnxruntime>=1.17"]
explain = ["shap>=0.44"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.9", "httpx>=0.27", "pandas-stubs"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "D"]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "E501",  # long lines are caught by the formatter, not worth failing CI over
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "ARG001", "ARG002"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true
plugins = []
exclude = "(^|/)(\\.venv|build|dist)/"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that train a model end to end",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
